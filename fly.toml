app = "persona-onboarding"
primary_region = "ord"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: calls hold sockets and timers in the process, and a cold start drops the first call.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "data"
  destination = "/data"
